<div class="relative flex items-center justify-center w-screen h-screen overflow-hidden">
  <p-toast [preventOpenDuplicates]="true" position="top-center"></p-toast>
  <div [ngClass]="{'animate-screenSaverIn': isScreenSaver, 'animate-screenSaverOut': !isScreenSaver}" class="absolute top-0 left-0 z-50 flex items-center justify-center w-full h-full translate-x-0">
    <ranjangaon-screen-saver></ranjangaon-screen-saver>
  </div>
  <ranjangaon-layout></ranjangaon-layout>
</div>
