<div class="flex flex-col items-start justify-start w-max h-max">
  @if(type === 1) {
    <span class="flex items-center justify-start gap-1.5">
      <p class="text-[36px] font-bold text-primary">{{title}}</p>
    </span>
    <p class="text-[16px] font-regular text-darkAsh">{{subTitle}}</p>
  }
  @else if(type === 2) {
    <p class="text-[24px] font-bold text-primary">{{title}}</p>
    <p class="text-[13px] font-regular text-description">{{subTitle}}</p>
  }
  @else if(type === 3) {
    <p class="text-[20px] font-bold text-primary">{{title}}</p>
    <p class="text-[12px] font-regular text-description">{{subTitle}}</p>
  }

</div>
